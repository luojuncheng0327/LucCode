name: Build Windows installer

# Manual-only: build the Windows NSIS installer using the committed version.
# Publication can be deferred until the downloaded installer is validated.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the installer after building
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          node scripts/validate-release-digest.mjs --tag "$tag" --file release-digest.v1.json
          node scripts/validate-release-digest.mjs --tag "$tag" --file release-digest.v2.json
          test -f ".github/release-notes-$tag.md"

      # vendor/mingit is gitignored; the Windows pack needs the official MinGit
      # (git.exe + sh.exe + coreutils) baked into resources/git/.
      - name: Download MinGit
        run: node scripts/download-mingit.js

      # The installer seed MUST be signed: build-server.mjs hard-fails without a
      # PKCS8 PEM private key. The secret holds the PEM body, this step writes it
      # to a file and exports the path the build expects.
      - name: Write artifact signing key
        shell: bash
        env:
          LUC_SIGN_KEY_PEM: ${{ secrets.LUC_SIGN_KEY }}
        run: |
          if [ -z "$LUC_SIGN_KEY_PEM" ]; then
            echo "::error::LUC_SIGN_KEY secret is missing; the seed archive MUST be signed"
            exit 1
          fi
          key="$RUNNER_TEMP/artifact-signing.pem"
          printf '%s\n' "$LUC_SIGN_KEY_PEM" > "$key"
          chmod 600 "$key"
          echo "LUC_SIGN_KEY=$key" >> "$GITHUB_ENV"

      - name: Build Windows installer
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Prepare release assets
        shell: pwsh
        run: |
          Copy-Item release-digest.v1.json, release-digest.v2.json dist/
          $checksums = Get-ChildItem dist -Filter *.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          $checksums | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/beta.yml
            dist/SHA256SUMS.txt
            dist/release-digest.v*.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish to GitHub release
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; use a new version instead of replacing its assets"
            exit 1
          fi
          gh release create "$tag" --target "$RELEASE_TARGET" --draft \
            --title "LucCode $version" --notes-file ".github/release-notes-$tag.md"
          assets=(dist/*.exe dist/*.exe.blockmap dist/SHA256SUMS.txt dist/release-digest.v*.json)
          for metadata in dist/latest.yml dist/beta.yml; do
            if [ -f "$metadata" ]; then assets+=("$metadata"); fi
          done
          gh release upload "$tag" "${assets[@]}"
          if [[ "$version" == *-* ]]; then
            gh release edit "$tag" --draft=false --prerelease
          else
            gh release edit "$tag" --draft=false --prerelease=false --latest
          fi
          gh release view "$tag" --json tagName,assets --jq '.tagName, (.assets[] | "\(.name) \(.size)")'
